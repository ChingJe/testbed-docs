name: exp11_frozen_baseline
description: >
  Rerun of exp10 with the fixed frozen degradation reference baseline.
  Key change: degradationRef buffer only updated when !degradationSignal,
  preventing CAT3 anomaly rounds from contaminating the z-score baseline.
  Also: degradationPolicy.minDecisionTrafficScale=1024 to guard WAPE
  instability at near-zero traffic. chronicPolicy field renamed to
  minDecisionTrafficScale (from minTrafficScale).
  Expected: 3 degradation hits at CAT3 (T=01:02:30, 01:05, 01:07:30).

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 150
        recentBufferSize: 12
        minBufferSamples: 3
        minSamples: 5
        primaryMetric: WAPE
        zScoreThreshold: 1.5
        minStd: 0.01
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        fixedFloor: 0.05
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: true
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.90
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        MODEL_META:
          inference:
            seq_length: 10

replay:
  dataset:
    report_period_sec: 30
  monitor:
    maturity_lag_sec: 60
  daisy:
    reuse_existing: true
  report:
    progress_every_slots: 10
