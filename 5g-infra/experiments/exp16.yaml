name: exp16_ci90_minsamp2
description: >
  Faster detection: checkInterval=90s (vs 150s in exp12), minSamples=2 (67% of
  3-pair theoretical max). Goal: detect CAT3 drift in ~4min instead of 7.5min.
  minBufSamples=2 kept from exp12. ES_PATIENCE=5 now applies via task config.

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 2
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.5
        minStd: 0.01
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        fixedFloor: 0.05
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: true
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.90
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 5
        LR_PATIENCE: 3
        MODEL_META:
          inference:
            seq_length: 10

replay:
  dataset:
    report_period_sec: 30
  monitor:
    maturity_lag_sec: 60
  daisy:
    reuse_existing: true
  report:
    progress_every_slots: 10
