name: exp17_ci90_buf3_chron095
description: >
  Fix exp16 over-triggering: minBufSamples=2->3 (3 rounds for stable std),
  chronic threshold=0.90->0.95 (initial WAPE ~0.96-0.98 still fires, but
  post-retrain WAPE ~0.50-0.85 stays silent). checkInterval=90s, minSamples=2
  kept. Goal: clean initial detection + CAT3 degradation in <7min.

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 3
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.5
        minStd: 0.01
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        fixedFloor: 0.05
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: true
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.95
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 5
        LR_PATIENCE: 3
        MODEL_META:
          inference:
            seq_length: 10

replay:
  dataset:
    report_period_sec: 30
  monitor:
    maturity_lag_sec: 60
  daisy:
    reuse_existing: true
  report:
    progress_every_slots: 10
