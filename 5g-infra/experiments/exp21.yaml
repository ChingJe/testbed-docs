name: exp21_cat1_initial_model
description: >
  First test with CAT1-trained initial model (out/initial_cat1/bundle).
  Policy params from exp17 (best result). breaking_time=900s so live phase
  covers CAT1 mid-point onwards, allowing observation of CAT1 WAPE and
  CAT1→CAT2→CAT3 transitions. seq_length=30 fixed (not overridden).

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 3
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.5
        minStd: 0.01
        fixedFloor: 0.05
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: true
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.95
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 5
        LR_PATIENCE: 3

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
  monitor:
    maturity_lag_sec: 60
  daisy:
    reuse_existing: true
  report:
    progress_every_slots: 10
