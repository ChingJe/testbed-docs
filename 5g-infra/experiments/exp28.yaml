name: exp28_local_initial_buf9_nochronic_rwin1200
description: >
  Delay the first retrain further so the first training window contains more
  CAT2 data before Daisy retraining starts.
  Based on exp27:
  - keep checkInterval=90s
  - keep minSamples=2 for testbed margin
  - keep chronicPolicy.enabled=false
  - keep retrain.window_sec=1200s
  Change only:
  - minBufferSamples: 5 -> 9
  Motivation:
  - exp25/exp27 removed early false positives but still triggered the first
    retrain at ~00:34:30, when CAT2 had only accumulated ~4.5 minutes
    (~9 slots), which is too little for a CAT2-focused retrain window.
  - Raising minBufferSamples should delay the first degradation trigger toward
    ~00:40:30, increasing CAT2 slots in the 1200s training window and giving
    the retrained model a better chance to form a lower-WAPE CAT2 baseline.
  Goal:
  - first trigger later than exp27
  - still no early group1 false trigger
  - ideally restore CAT2→CAT3 as a second degradation trigger
  Run with:
    uv run run_experiment.py experiments/exp28.yaml \
      --initial-bundle out/initial_local_cat1_30s_v2/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 9
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.5
        minStd: 0.14
        fixedFloor: 0.05
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 5
        LR_PATIENCE: 3

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: true
  report:
    progress_every_slots: 10
