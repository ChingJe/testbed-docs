name: exp36_local_initial_v5_oracle_scaler_rwin1200_z14
description: >
  Follow-up to exp35 using the v5 initial bundle produced by
  train_initial_local.py with Strategy B:
  - model trained on CAT1 only
  - scaler fit on the full replay data (offline oracle baseline)
  Motivation:
  - Keep the current Daisy scaler lifecycle and monitor policy unchanged.
  - Isolate the effect of replacing the initial bundle with the v5
    CAT1-trained + all-data-scaler bundle.
  Keep unchanged from exp35:
  - samplingInterval=30s
  - checkInterval=90s
  - recentBufferSize=12
  - minBufferSamples=5
  - minSamples=2
  - primaryMetric=WAPE
  - zScoreThreshold=1.4
  - minStd=0.14
  - fixedFloor=0.05
  - decisionWindowSize=5
  - requiredHitsInWindow=3
  - chronicPolicy.enabled=false
  - retrain.window_sec=1200
  - ES_PATIENCE=5
  - LR_PATIENCE=3
  - local_epochs=3
  Run with:
    uv run run_experiment.py ../../../docs/5g-infra/experiments/exp36.yaml \
      --initial-bundle out/initial_local_cat1_30s_v5/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 5
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.4
        minStd: 0.14
        fixedFloor: 0.05
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 5
        LR_PATIENCE: 3
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: true
  report:
    progress_every_slots: 10
