name: exp42_local_initial_v6_freshinit_fedscaler_es2_lr1_le3_lr5e4
description: >
  Fresh-init follow-up to exp41.
  Keep the old retrain semantics unchanged:
  - initial bundle uses the CAT1-trained + CAT1-scaled v6 bundle
  - per-task Daisy retrain still uses fresh init + federated aggregated scaler
  - replay trigger policy and retrain window remain unchanged
  Motivation:
  - exp41 likely made the first post-CAT1 model too weak / too blunt for CAT2
    by reducing both patience and local training volume at the same time
  - recover some CAT2 adaptation capacity by restoring local_epochs to 3
    while still keeping earlier stopping / faster LR decay than exp40
  Main changes from exp40:
  - ES_PATIENCE: 5 -> 2
  - LR_PATIENCE: 3 -> 1
  - INITIAL_LR: 1e-3 -> 5e-4
  - local_epochs stays at 3
  Intended check:
  - preserve two retrains, both after CAT switches
  - avoid the exp41 failure mode where CAT2 model quality degrades
    enough to suppress the second retrain trigger
  Keep unchanged:
  - initial bundle semantics: CAT1-trained + CAT1 scaler
  - samplingInterval=30s
  - checkInterval=90s
  - recentBufferSize=12
  - minBufferSamples=5
  - minSamples=2
  - primaryMetric=WAPE
  - zScoreThreshold=1.4
  - minStd=0.14
  - fixedFloor=0.05
  - decisionWindowSize=5
  - requiredHitsInWindow=3
  - chronicPolicy.enabled=false
  - retrain.window_sec=1200
  Run with:
    uv run run_experiment.py ../../../docs/5g-infra/experiments/exp42.yaml \
      --initial-bundle out/initial_local_cat1_30s_v6/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 5
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.4
        minStd: 0.14
        fixedFloor: 0.05
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 2
        LR_PATIENCE: 1
        INITIAL_LR: 0.0005
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
