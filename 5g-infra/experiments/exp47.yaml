name: exp47_local_initial_v6_freshinit_fedscaler_es3_lrpat2
description: >
  Fresh-init follow-up to exp46.
  Keep the old retrain semantics unchanged:
  - initial bundle uses the CAT1-trained + CAT1-scaled v6 bundle
  - per-task Daisy retrain still uses fresh init + federated aggregated scaler
  - replay trigger policy and retrain window remain unchanged
  Motivation:
  - exp46 is currently the best-balanced run:
    it preserves both CAT-switch retrains, restores CAT2 quality close to exp40,
    and still improves CAT3 quality over exp40 with shorter wall time than exp45
  - the next conservative step is to reduce early-stopping patience by one more
    round while keeping the successful exp46 learning-rate settings intact
  Main changes from exp40:
  - LR_PATIENCE: 3 -> 2
  - ES_PATIENCE: 5 -> 3
  Keep unchanged from exp40:
  - INITIAL_LR: 1e-3
  - MODEL_META.training.local_epochs: 3
  - initial bundle semantics: CAT1-trained + CAT1 scaler
  - samplingInterval=30s
  - checkInterval=90s
  - recentBufferSize=12
  - minBufferSamples=5
  - minSamples=2
  - primaryMetric=WAPE
  - zScoreThreshold=1.4
  - minStd=0.14
  - fixedFloor=0.05
  - decisionWindowSize=5
  - requiredHitsInWindow=3
  - chronicPolicy.enabled=false
  - retrain.window_sec=1200
  Intended check:
  - preserve two retrains, both after CAT switches
  - keep CAT2 performance near exp46
  - reduce second retrain wall time relative to exp46
  Run with:
    uv run run_experiment.py ../../../docs/5g-infra/experiments/exp47.yaml \
      --initial-bundle out/initial_local_cat1_30s_v6/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        recentBufferSize: 12
        minBufferSamples: 5
        minSamples: 2
        primaryMetric: WAPE
        zScoreThreshold: 1.4
        minStd: 0.14
        fixedFloor: 0.05
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        ES_PATIENCE: 3
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
