name: exp50_post_cat_switch_only_two_retrains_es2
description: >
  Follow-up to exp49 focused on Daisy early stopping behavior.
  Goal:
  - keep the exp49 trigger policy that already restored the first post-switch retrain
  - shorten the first retrain so the deployed model is less likely to be a late-round
    degraded checkpoint
  Context from exp49:
  - the first retrain did trigger at group2 after CAT1->CAT2
  - Daisy validation loss kept improving until the late rounds, then degraded
  - Daisy currently packages the final model state, not an explicit best-validation checkpoint
  Main change from exp49:
  - ES_PATIENCE: 4 -> 2
  Keep unchanged from exp49:
  - LR_PATIENCE: 2
  - INITIAL_LR: 1e-3
  - local_epochs: 3
  - zScoreThreshold: 1.3
  - requiredHitsInWindow: 2
  Intended effect:
  - stop the first retrain closer to the best observed validation region
  - reduce the chance that the first swapped model flattens CAT3 into a uniformly high-WAPE regime
  - preserve the exp49 first retrain while improving the chance of a second post-switch retrain

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
        inputWindow: 30
        outputWindow: 1
        lookbackBuffer: 15
        ringBufferSize: 50
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        minSamples: 2
        warmupDuration: 20
        primaryMetric: WAPE
        recentBufferSize: 12
        minBufferSamples: 5
        minStd: 0.14
        fixedFloor: 0.05
        zScoreThreshold: 1.3
        decisionWindowSize: 5
        requiredHitsInWindow: 2
        consecutiveBreaches: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        NUM_ROUNDS: 30
        ES_PATIENCE: 2
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
    use_pseudo_warmstart: true
    subscription_to_first_urr_delay_sec: 30
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
