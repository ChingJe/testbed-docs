name: exp60_v7_minscale_1p5m_skip_daisy_check
description: >
  Fast replay check using the v7 initial bundle, with Daisy skipped.
  Goal:
  - test whether raising degradationPolicy.minDecisionTrafficScale to 1572864
    can suppress the third group1 retrain seen in exp59
  - preserve the first two meaningful retrains if possible
  Main change from exp58/59:
  - degradationPolicy.minDecisionTrafficScale: 327680 -> 1572864
  Keep unchanged:
  - initial bundle: initial_local_cat1_30s_v7
  - ES_PATIENCE: 2
  - LR_PATIENCE: 2
  - INITIAL_LR: 1e-3
  - local_epochs: 3
  - zScoreThreshold: 1.3
  - requiredHitsInWindow: 2

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
        inputWindow: 30
        outputWindow: 1
        lookbackBuffer: 15
        ringBufferSize: 50
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        minSamples: 2
        warmupDuration: 20
        primaryMetric: WAPE
        recentBufferSize: 12
        minBufferSamples: 5
        minStd: 0.14
        fixedFloor: 0.05
        zScoreThreshold: 1.3
        decisionWindowSize: 5
        requiredHitsInWindow: 2
        consecutiveBreaches: 3
        degradationPolicy:
          minDecisionTrafficScale: 1572864
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        NUM_ROUNDS: 30
        ES_PATIENCE: 2
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
    use_pseudo_warmstart: true
    subscription_to_first_urr_delay_sec: 30
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
