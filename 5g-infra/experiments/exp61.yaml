name: exp61_v7_minscale_1p5m_daisy
description: >
  Full Daisy replay run using the v7 initial bundle and
  degradationPolicy.minDecisionTrafficScale=1572864.
  Goal:
  - validate the exp60 skip-Daisy result under real Daisy wall time
  - keep the first retrain in early CAT2
  - check whether the third retrain stays suppressed while only two retrains
    remain
  Main change from exp59:
  - degradationPolicy.minDecisionTrafficScale: 327680 -> 1572864
  Keep unchanged from exp59:
  - initial bundle: initial_local_cat1_30s_v7
  - ES_PATIENCE: 2
  - LR_PATIENCE: 2
  - INITIAL_LR: 1e-3
  - local_epochs: 3
  - zScoreThreshold: 1.3
  - requiredHitsInWindow: 2
  Intended effect:
  - preserve a meaningful first retrain
  - delay or suppress the late third group1 retrain seen in exp59
  Run with:
    uv run run_experiment.py ../../../docs/5g-infra/experiments/exp61.yaml \
      --initial-bundle out/initial_local_cat1_30s_v7/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
        inputWindow: 30
        outputWindow: 1
        lookbackBuffer: 15
        ringBufferSize: 50
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        minSamples: 2
        warmupDuration: 20
        primaryMetric: WAPE
        recentBufferSize: 12
        minBufferSamples: 5
        minStd: 0.14
        fixedFloor: 0.05
        zScoreThreshold: 1.3
        decisionWindowSize: 5
        requiredHitsInWindow: 2
        consecutiveBreaches: 3
        degradationPolicy:
          minDecisionTrafficScale: 1572864
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        NUM_ROUNDS: 30
        ES_PATIENCE: 2
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
    use_pseudo_warmstart: true
    subscription_to_first_urr_delay_sec: 30
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
