name: exp63_v7_minscale_1m_daisy
description: >
  Full Daisy replay run using the v7 initial bundle and
  degradationPolicy.minDecisionTrafficScale=1048576.
  Goal:
  - validate the exp62 skip-Daisy result under real Daisy wall time
  - keep the first retrain in early CAT2
  - preserve the second retrain while suppressing the late third retrain

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
        inputWindow: 30
        outputWindow: 1
        lookbackBuffer: 15
        ringBufferSize: 50
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        minSamples: 2
        warmupDuration: 20
        primaryMetric: WAPE
        recentBufferSize: 12
        minBufferSamples: 5
        minStd: 0.14
        fixedFloor: 0.05
        zScoreThreshold: 1.3
        decisionWindowSize: 5
        requiredHitsInWindow: 2
        consecutiveBreaches: 3
        degradationPolicy:
          minDecisionTrafficScale: 1048576
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        NUM_ROUNDS: 30
        ES_PATIENCE: 2
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
    use_pseudo_warmstart: true
    subscription_to_first_urr_delay_sec: 30
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
