name: exp66_v7_minscale_320k_daisy_two_transition_probe
description: >
  Second full Daisy probe for the two-transition retrain target.
  Goal:
  - keep the current exp64 parity line unchanged
  - move degradationPolicy.minDecisionTrafficScale upward from `1024` to
    `327680`
  - test whether a practical traffic gate can preserve the first two
    transition-driven retrains while suppressing the late extra retrain
  Relationship to exp65:
  - exp65 intentionally used `1024` as a permissive probe and produced `3`
    retrains
  - exp66 is the first step back toward a practical gate
  Status:
  - this run was started during the current round, but the execution was
    interrupted before completion
  - therefore exp66 is currently a prepared config / partial run only
  - do not treat it as a completed experimental result in summaries
  Run with:
    uv run run_experiment.py ../../../docs/5g-infra/experiments/exp66.yaml \
      --initial-bundle out/initial_local_cat1_30s_v7/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
        inputWindow: 30
        outputWindow: 1
        lookbackBuffer: 15
        ringBufferSize: 50
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        minSamples: 2
        warmupDuration: 20
        primaryMetric: WAPE
        recentBufferSize: 12
        minBufferSamples: 5
        minStd: 0.14
        fixedFloor: 0.05
        zScoreThreshold: 1.3
        decisionWindowSize: 5
        requiredHitsInWindow: 2
        consecutiveBreaches: 3
        degradationPolicy:
          minDecisionTrafficScale: 327680
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        NUM_ROUNDS: 30
        ES_PATIENCE: 2
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
    use_pseudo_warmstart: true
    subscription_to_first_urr_delay_sec: 30
  startup_timing:
    mode: explicit_offsets
    subscription_to_first_urr_signal_sec: 3
    first_urr_signal_to_anchor_sec: 1
    anchor_to_first_visible_inference_sec: 56
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
