name: exp67_v7_minscale_1k_hits3_daisy_two_transition_probe
description: >
  Direct follow-up to exp65.
  Goal:
  - keep the same parity-converged replay line and permissive
    degradationPolicy.minDecisionTrafficScale=1024
  - change only requiredHitsInWindow from `2` to `3`
  - test whether the first retrain still triggers, and whether delaying the
    second retrain leaves more CAT3 data for training and suppresses the third
    retrain
  Relationship to exp65:
  - exp65 produced three retrains at `00:34:47`, `01:03:17`, `01:25:47`
  - exp67 isolates the effect of requiring one additional degradation hit
  Run with:
    uv run run_experiment.py ../../../docs/5g-infra/experiments/exp67.yaml \
      --initial-bundle out/initial_local_cat1_30s_v7/bundle

nwdaf:
  configuration:
    analytics:
      ueCommunication:
        samplingInterval: 30
        inputWindow: 30
        outputWindow: 1
        lookbackBuffer: 15
        ringBufferSize: 50
    mtlf:
      accuracyMonitor:
        checkInterval: 90
        minSamples: 2
        warmupDuration: 20
        primaryMetric: WAPE
        recentBufferSize: 12
        minBufferSamples: 5
        minStd: 0.14
        fixedFloor: 0.05
        zScoreThreshold: 1.3
        decisionWindowSize: 5
        requiredHitsInWindow: 3
        consecutiveBreaches: 3
        degradationPolicy:
          minDecisionTrafficScale: 1024
        chronicPolicy:
          enabled: false
          metric: WAPE
          aggregator: percentile
          percentile: 75
          threshold: 0.97
          minDecisionTrafficScale: 1024
        lowTrafficOverpredictionPolicy:
          enabled: false
      task:
        NUM_ROUNDS: 30
        ES_PATIENCE: 2
        LR_PATIENCE: 2
        INITIAL_LR: 0.001
        MODEL_META:
          training:
            local_epochs: 3
    adrf:
      retrainWindow: 1200

replay:
  dataset:
    report_period_sec: 30
    breaking_time_sec: 900
    use_pseudo_warmstart: true
    subscription_to_first_urr_delay_sec: 30
  startup_timing:
    mode: explicit_offsets
    subscription_to_first_urr_signal_sec: 3
    first_urr_signal_to_anchor_sec: 1
    anchor_to_first_visible_inference_sec: 56
  monitor:
    maturity_lag_sec: 60
  retrain:
    window_sec: 1200
  daisy:
    reuse_existing: false
  report:
    progress_every_slots: 10
